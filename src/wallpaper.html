<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #v, #img, #gl { position: absolute; inset: 0; width: 100vw; height: 100vh; object-fit: cover; transform-origin: center center; display: block; }
  #img, #gl { display: none; }
  #tile { position: absolute; inset: 0; width: 100vw; height: 100vh; display: none; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="sh1"><feConvolveMatrix order="3" kernelMatrix="0 -0.12 0 -0.12 1.48 -0.12 0 -0.12 0" preserveAlpha="true"/></filter>
    <filter id="sh2"><feConvolveMatrix order="3" kernelMatrix="0 -0.3 0 -0.3 2.2 -0.3 0 -0.3 0" preserveAlpha="true"/></filter>
    <filter id="sh3"><feConvolveMatrix order="3" kernelMatrix="0 -0.55 0 -0.55 3.2 -0.55 0 -0.55 0" preserveAlpha="true"/></filter>
  </defs>
</svg>
<video id="v" playsinline></video>
<img id="img" alt="">
<canvas id="tile"></canvas>
<canvas id="gl"></canvas>
<script>
const v = document.getElementById('v');
const img = document.getElementById('img');
const tile = document.getElementById('tile');
const glCanvas = document.getElementById('gl');
const tctx = tile.getContext('2d');
const cell = document.createElement('canvas');
const cctx = cell.getContext('2d');
let currentUrl = null, raf = null;
let type = 'video', imgLoaded = false, mediaPaused = false;
let opt = { volume: 0.5, muted: true, loop: true, fit: 'cover', sharpness: 1, scale: 100 };

// 视频锐化走 GPU 卷积；SVG feConvolveMatrix 逐帧软件卷积会在 4K60 下丢帧
const KERNELS = { 1: [1.48, -0.12], 2: [2.2, -0.3], 3: [3.2, -0.55] };
let gl, glProg, glTex, glLoc = {}, glRaf = null, glLastRev = -1, glTileRev = 0;
function initGL() {
  if (gl !== undefined) return gl;
  gl = false;
  try {
    // alpha:true 使 GL 层不被视为不透明，下层 video 保持合成节奏（隐藏会导致解码停走 bursts）
    const ctx = glCanvas.getContext('webgl', { alpha: true, antialias: false, depth: false, stencil: false, preserveDrawingBuffer: true });
    if (!ctx) return gl;
    const compile = (kind, src) => {
      const s = ctx.createShader(kind); ctx.shaderSource(s, src); ctx.compileShader(s);
      if (!ctx.getShaderParameter(s, ctx.COMPILE_STATUS)) throw new Error(ctx.getShaderInfoLog(s));
      return s;
    };
    const vs = compile(ctx.VERTEX_SHADER, 'attribute vec2 p; varying vec2 uv; void main(){ uv = p*0.5+0.5; gl_Position = vec4(p,0.,1.); }');
    const fs = compile(ctx.FRAGMENT_SHADER, [
      'precision mediump float; varying vec2 uv; uniform sampler2D t;',
      'uniform vec2 uvs; uniform vec2 texel; uniform float kc; uniform float ks; uniform float bound;',
      'void main(){',
      '  vec2 p = vec2(uv.x, 1.0-uv.y);',
      '  vec2 q = (p-0.5)*uvs+0.5;',
      '  if (bound > 0.5 && (q.x<0.0 || q.x>1.0 || q.y<0.0 || q.y>1.0)) { gl_FragColor = vec4(0.,0.,0.,1.); return; }',
      '  vec3 c = texture2D(t,q).rgb*kc + (texture2D(t,q+vec2(texel.x,0.)).rgb + texture2D(t,q-vec2(texel.x,0.)).rgb + texture2D(t,q+vec2(0.,texel.y)).rgb + texture2D(t,q-vec2(0.,texel.y)).rgb)*ks;',
      '  gl_FragColor = vec4(clamp(c,0.,1.),1.);',
      '}'
    ].join('\n'));
    glProg = ctx.createProgram(); ctx.attachShader(glProg, vs); ctx.attachShader(glProg, fs); ctx.linkProgram(glProg);
    if (!ctx.getProgramParameter(glProg, ctx.LINK_STATUS)) throw new Error(ctx.getProgramInfoLog(glProg));
    ctx.useProgram(glProg);
    const buf = ctx.createBuffer(); ctx.bindBuffer(ctx.ARRAY_BUFFER, buf);
    ctx.bufferData(ctx.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), ctx.STATIC_DRAW);
    const loc = ctx.getAttribLocation(glProg, 'p'); ctx.enableVertexAttribArray(loc); ctx.vertexAttribPointer(loc, 2, ctx.FLOAT, false, 0, 0);
    for (const n of ['uvs', 'texel', 'kc', 'ks', 'bound']) glLoc[n] = ctx.getUniformLocation(glProg, n);
    glTex = ctx.createTexture(); ctx.bindTexture(ctx.TEXTURE_2D, glTex);
    ctx.texParameteri(ctx.TEXTURE_2D, ctx.TEXTURE_WRAP_S, ctx.CLAMP_TO_EDGE);
    ctx.texParameteri(ctx.TEXTURE_2D, ctx.TEXTURE_WRAP_T, ctx.CLAMP_TO_EDGE);
    ctx.texParameteri(ctx.TEXTURE_2D, ctx.TEXTURE_MIN_FILTER, ctx.LINEAR);
    ctx.texParameteri(ctx.TEXTURE_2D, ctx.TEXTURE_MAG_FILTER, ctx.LINEAR);
    gl = ctx;
  } catch (e) { gl = false; }
  return gl;
}
function sizeGL() {
  const w = Math.round(innerWidth * devicePixelRatio), h = Math.round(innerHeight * devicePixelRatio);
  if (glCanvas.width !== w || glCanvas.height !== h) { glCanvas.width = w; glCanvas.height = h; gl.viewport(0, 0, w, h); }
}
function drawGL(force) {
  glRaf = null;
  if (!(type === 'video' && opt.sharpness > 0 && gl)) return;
  const isTile = opt.fit === 'tile';
  const src = isTile ? tile : v;
  const sw = isTile ? tile.width : v.videoWidth, sh = isTile ? tile.height : v.videoHeight;
  const rev = isTile ? glTileRev : v.getVideoPlaybackQuality().totalVideoFrames;
  if (sw && sh && (isTile || v.readyState >= 2) && (force || rev !== glLastRev)) {
    glLastRev = rev;
    sizeGL();
    gl.bindTexture(gl.TEXTURE_2D, glTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
    const W = glCanvas.width, H = glCanvas.height;
    let uvs = [1, 1], bound = 0;
    if (!isTile) {
      const sc = opt.scale / 100, vw = v.videoWidth, vh = v.videoHeight;
      if (opt.fit === 'fill') uvs = [1, 1];
      else {
        const base = opt.fit === 'contain' ? Math.min(W / vw, H / vh) : opt.fit === 'center' ? devicePixelRatio : Math.max(W / vw, H / vh);
        uvs = [W / (vw * base * sc), H / (vh * base * sc)];
        bound = (opt.fit === 'contain' || opt.fit === 'center') ? 1 : 0;
      }
    }
    const k = KERNELS[opt.sharpness] || KERNELS[1];
    gl.uniform2f(glLoc.uvs, uvs[0], uvs[1]);
    gl.uniform2f(glLoc.texel, 1 / sw, 1 / sh);
    gl.uniform1f(glLoc.kc, k[0]); gl.uniform1f(glLoc.ks, k[1]); gl.uniform1f(glLoc.bound, bound);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  glRaf = requestAnimationFrame(() => drawGL(false));
}

function sourceEl() { return type === 'image' ? img : v; }
function isPlaying() { return type === 'image' ? (imgLoaded && !mediaPaused) : (!v.paused && !v.ended); }
function report(extra) {
  window.wallpaperHost.report({
    playing: isPlaying(),
    currentTime: type === 'image' ? 0 : (v.currentTime || 0),
    duration: type === 'image' ? 0 : (v.duration || 0),
    ...extra
  });
}
function sizeTile() {
  tile.width = Math.round(innerWidth * devicePixelRatio);
  tile.height = Math.round(innerHeight * devicePixelRatio);
}
function drawTile() {
  if (opt.fit !== 'tile') { raf = null; return; }
  const src = sourceEl();
  const sc = opt.scale / 100;
  const vw = (type === 'image' ? img.naturalWidth : v.videoWidth) || 16;
  const vh = (type === 'image' ? img.naturalHeight : v.videoHeight) || 9;
  const cw = Math.max(1, Math.round(vw * sc)), ch = Math.max(1, Math.round(vh * sc));
  if (cell.width !== cw) cell.width = cw;
  if (cell.height !== ch) cell.height = ch;
  cctx.drawImage(src, 0, 0, cw, ch);
  tctx.setTransform(1, 0, 0, 1, 0, 0);
  tctx.fillStyle = tctx.createPattern(cell, 'repeat');
  tctx.fillRect(0, 0, tile.width, tile.height);
  glTileRev++;
  raf = type === 'video' ? requestAnimationFrame(drawTile) : null;
}
function applyAll() {
  v.volume = opt.volume; v.muted = opt.muted; v.loop = opt.loop;
  const isTile = opt.fit === 'tile';
  const useGL = type === 'video' && opt.sharpness > 0 && !!initGL();
  const fit = isTile ? 'cover' : (opt.fit === 'center' ? 'none' : opt.fit);
  const tf = isTile ? 'none' : 'scale(' + (opt.scale / 100) + ')';
  const svgFilt = opt.sharpness > 0 ? 'url(#sh' + opt.sharpness + ')' : 'none';
  v.style.objectFit = fit;
  v.style.transform = tf;
  v.style.filter = (type === 'video' && !useGL) ? svgFilt : 'none';
  v.style.visibility = 'visible';
  v.style.display = type === 'video' ? 'block' : 'none';
  img.style.objectFit = fit;
  img.style.transform = tf;
  img.style.filter = type === 'image' ? svgFilt : 'none';
  img.style.display = type === 'image' ? 'block' : 'none';
  tile.style.filter = (type === 'image' || !useGL) ? svgFilt : 'none';
  tile.style.display = (isTile && !useGL) ? 'block' : 'none';
  glCanvas.style.display = useGL ? 'block' : 'none';
  if (isTile) { sizeTile(); if (!raf) drawTile(); }
  else if (raf) { cancelAnimationFrame(raf); raf = null; }
  if (useGL) { if (!glRaf) drawGL(true); }
  else if (glRaf) { cancelAnimationFrame(glRaf); glRaf = null; }
}

window.wallpaperHost.onLoadMedia(data => {
  currentUrl = data.url;
  type = data.type === 'image' ? 'image' : 'video';
  Object.assign(opt, { volume: data.volume, muted: data.muted, loop: data.loop, fit: data.fit, sharpness: data.sharpness, scale: data.scale });
  mediaPaused = false;
  if (type === 'image') {
    v.pause(); v.removeAttribute('src'); v.load();
    imgLoaded = false;
    img.src = data.url;
  } else {
    imgLoaded = false; img.removeAttribute('src');
    v.src = data.url;
    v.pause();
  }
  applyAll();
  report({ error: null });
});
window.wallpaperHost.onCommand(cmd => {
  if (cmd === 'play') {
    mediaPaused = false;
    if (type === 'video') {
      if (!v.src && currentUrl) v.src = currentUrl;
      v.play().then(() => report({ error: null })).catch(err => report({ error: String(err) }));
    } else report({ error: null });
  } else if (cmd === 'pause') {
    mediaPaused = true;
    if (type === 'video') v.pause();
    report();
  }
});
window.wallpaperHost.onOptions(o => { Object.assign(opt, o); applyAll(); });

v.addEventListener('play', () => report());
v.addEventListener('pause', () => report());
v.addEventListener('ended', () => report({ ended: true }));
v.addEventListener('error', () => {
  const codes = { 1: '加载中止', 2: '网络错误', 3: '解码错误', 4: '文件无法播放（格式不支持或已损坏）' };
  report({ error: v.error ? (codes[v.error.code] || v.error.message) : '未知播放错误' });
});
img.addEventListener('load', () => { imgLoaded = true; applyAll(); report({ error: null }); });
img.addEventListener('error', () => { imgLoaded = false; report({ error: '图片无法加载（格式不支持或已损坏）' }); });
addEventListener('resize', () => {
  if (opt.fit === 'tile') { sizeTile(); if (!raf) drawTile(); }
  if (type === 'video' && opt.sharpness > 0 && gl) drawGL(true);
});
setInterval(() => { if (currentUrl) report(); }, 1000);
</script>
</body>
</html>
